<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Study AI 📚</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }
    select, input, textarea, button {
      width: 100%;
      margin: 6px 0;
      padding: 8px;
    }
    pre {
      background: #f4f4f4;
      padding: 10px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

<h2>Study AI 📚</h2>

<select id="mode">
  <option value="quiz">Quiz</option>
  <option value="flashcards">Flashcards</option>
  <option value="summary">Summarizer</option>
  <option value="notes">Note Maker</option>
</select>

<input id="subject" placeholder="Subject">
<input id="material" placeholder="Specific topic">
<input id="amount" placeholder="Number of questions / flashcards">
<textarea id="text" placeholder="Paste text (for summarizer)"></textarea>

<button onclick="run()">Generate</button>

<pre id="output"></pre>

<script>
const API_KEY = "gsk_XXXXXXXXXXXXXXXXXXXXXXXX"; // your key
const API_URL = "https://api.groq.com/openai/v1/chat/completions";

async function run() {
  const mode = modeEl.value;
  const subject = subjectEl.value;
  const material = materialEl.value;
  const amount = amountEl.value;
  const text = textEl.value;

  let prompt = "";

  if (mode === "quiz") {
    prompt = `Create exactly ${amount} questions about ${subject}, focused on ${material}. Do not include answers.`;
  } else if (mode === "flashcards") {
    prompt = `Create exactly ${amount} flashcards about ${subject}, focused on ${material}. Format strictly as Q: / A:.`;
  } else if (mode === "summary") {
    prompt = `Summarize the following text clearly and concisely:\n\n${text}`;
  } else {
    prompt = `Generate concise study notes for '${material}' in '${subject}'. Use bullet points only.`;
  }

  output.textContent = "Loading...";

  const res = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${API_KEY}`
    },
    body: JSON.stringify({
      model: "openai/gpt-oss-120b",
      messages: [{ role: "user", content: prompt }]
    })
  });

  const data = await res.json();
  output.textContent =
    data.choices?.[0]?.message?.content || "Error occurred";
}

const modeEl = document.getElementById("mode");
const subjectEl = document.getElementById("subject");
const materialEl = document.getElementById("material");
const amountEl = document.getElementById("amount");
const textEl = document.getElementById("text");
const output = document.getElementById("output");
</script>

</body>
</html>
