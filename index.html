<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Study AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f6f7fb;
    margin: 0;
    padding: 20px;
    color: #222;
  }

  .container {
    max-width: 800px;
    margin: auto;
  }

  h1 {
    text-align: center;
    margin-bottom: 10px;
  }

  .card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
  }

  label {
    font-weight: 600;
    margin-top: 12px;
    display: block;
  }

  select, input, textarea, button {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 14px;
  }

  textarea {
    resize: vertical;
    min-height: 100px;
  }

  button {
    background: #4f46e5;
    color: white;
    font-weight: bold;
    cursor: pointer;
    border: none;
    margin-top: 16px;
  }

  button:hover {
    background: #4338ca;
  }

  .output {
    white-space: pre-wrap;
    background: #f1f2f6;
    padding: 15px;
    border-radius: 10px;
    font-size: 14px;
  }

  .hidden {
    display: none;
  }
</style>
</head>
<body>

<div class="container">
  <h1>📚 Study AI</h1>
  <p style="text-align:center;color:#555">
    Quiz • Flashcards • Summaries • Notes
  </p>

  <div class="card">
    <label>Mode</label>
    <select id="mode" onchange="updateUI()">
      <option value="quiz">Quiz</option>
      <option value="flashcards">Flashcards</option>
      <option value="summary">Summarizer</option>
      <option value="notes">Note Maker</option>
    </select>

    <label>Subject</label>
    <input id="subject" placeholder="e.g. Physics">

    <label>Topic</label>
    <input id="material" placeholder="e.g. Newton's Laws">

    <div id="amountBox">
      <label>Number</label>
      <input id="amount" type="number" placeholder="e.g. 5">
    </div>

    <div id="textBox" class="hidden">
      <label>Text to summarize</label>
      <textarea id="text"></textarea>
    </div>

    <button onclick="run()">Generate</button>
  </div>

  <div class="card">
    <h3>Output</h3>
    <div id="output" class="output">Waiting for input...</div>
  </div>
</div>

<script>
const API_KEY = "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";
const API_URL = "https://api.groq.com/openai/v1/chat/completions";

function updateUI() {
  const mode = document.getElementById("mode").value;
  document.getElementById("amountBox").classList.toggle(
    "hidden", mode === "summary"
  );
  document.getElementById("textBox").classList.toggle(
    "hidden", mode !== "summary"
  );
}

async function run() {
  const mode = mode.value;
  const subject = subject.value;
  const material = material.value;
  const amount = amount.value;
  const text = text.value;
  const output = document.getElementById("output");

  let prompt = "";

  if (mode === "quiz")
    prompt = `Create exactly ${amount} quiz questions about ${subject}, focused on ${material}. Do not include answers.`;

  if (mode === "flashcards")
    prompt = `Create exactly ${amount} flashcards about ${subject}, focused on ${material}. Format Q/A.`;

  if (mode === "summary")
    prompt = `Summarize the following text clearly:\n\n${text}`;

  if (mode === "notes")
    prompt = `Generate concise study notes for '${material}' in '${subject}'. Bullet points only.`;

  output.textContent = "Thinking...";

  const res = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Authorization": `Bearer ${API_KEY}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      model: "openai/gpt-oss-120b",
      messages: [{ role: "user", content: prompt }]
    })
  });

  const data = await res.json();
  output.textContent = data.choices?.[0]?.message?.content || "No response.";
}

updateUI();
</script>

</body>
</html>
